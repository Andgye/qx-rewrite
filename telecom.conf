# 电信营业厅登录态捕获
# 覆盖 App 登录、金豆活动、翼播客、商城及福利接口，兼容接口端口变化。
^https:\/\/(?:appgologin|appfuwu|wappark|wapact|xbk)\.189\.cn(?::\d+)?\/ url script-request-header https://raw.githubusercontent.com/Andgye/qx-rewrite/main/telecom_capture.js
^https:\/\/(?:appgologin|appfuwu|wappark|wapact|xbk)\.189\.cn(?::\d+)?\/ url script-response-header https://raw.githubusercontent.com/Andgye/qx-rewrite/main/telecom_capture.js

# App 登录请求体里包含手机号；单独抓一次可用于还原账号。
^https:\/\/appgologin\.189\.cn(?::\d+)?\/login\/client\/userLoginNormal(?:\?.*)?$ url script-request-body https://raw.githubusercontent.com/Andgye/qx-rewrite/main/telecom_capture.js
^https:\/\/appgologin\.189\.cn(?::\d+)?\/login\/client\/userLoginNormal(?:\?.*)?$ url script-response-body https://raw.githubusercontent.com/Andgye/qx-rewrite/main/telecom_capture.js

hostname = appgologin.189.cn, appfuwu.189.cn, wappark.189.cn, wapact.189.cn, xbk.189.cn
